<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <defs>
    <linearGradient id="face" x1="0" x2="1">
      <stop offset="0%"  stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#FF2DAA"/>
    </linearGradient>
    <filter id="vol">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none"
            stroke="#00F0FF" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#07070f"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- sway illusion via skew animation -->
  <g transform="translate(600,210)" filter="url(#vol)">
    <animateTransform attributeName="transform"
      type="translate"
      values="600,210; 620,210; 600,210; 580,210; 600,210"
      dur="6s" repeatCount="indefinite"/>

    <!-- extrusion layers -->
    <g fill="#9D4EDD" opacity="0.55">
      <text x="6" y="6" text-anchor="middle"
            font-family="Orbitron, sans-serif"
            font-size="110" font-weight="900">Ablaze Pariyar</text>
      <text x="4" y="4" text-anchor="middle"
            font-family="Orbitron, sans-serif"
            font-size="110" font-weight="900">Ablaze Pariyar</text>
      <text x="2" y="2" text-anchor="middle"
            font-family="Orbitron, sans-serif"
            font-size="110" font-weight="900">Ablaze Pariyar</text>
    </g>

    <!-- front face -->
    <text x="0" y="0" text-anchor="middle"
          font-family="Orbitron, sans-serif"
          font-size="110" font-weight="900"
          fill="url(#face)">Ablaze Pariyar</text>
  </g>
</svg>