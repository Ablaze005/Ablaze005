<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A12"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#FF2DAA"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1800" height="600" fill="url(#sky)"/>

  <!-- Grid horizon -->
  <g stroke="#00F0FF" stroke-opacity="0.25">
    <line x1="0" y1="450" x2="1800" y2="450"/>
    <line x1="0" y1="500" x2="1800" y2="500"/>
    <line x1="0" y1="560" x2="1800" y2="560"/>
  </g>

  <!-- Neon Title -->
  <text x="900" y="330" text-anchor="middle"
        font-family="Orbitron, Segoe UI, sans-serif"
        font-size="150" font-weight="900"
        fill="url(#neon)" filter="url(#glow)">
    Ablaze Pariyar
    <animate attributeName="opacity"
             values="1;0.75;1" dur="2.4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="900" y="410" text-anchor="middle"
        font-family="JetBrains Mono, monospace"
        font-size="28" fill="#00F0FF" opacity="0.8"
        letter-spacing="8">
    &lt;/&gt; FULL-STACK · CREATIVE DEV · CYBERPUNK
  </text>
</svg>
